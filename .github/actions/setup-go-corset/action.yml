name: 'Setup go corset'
description: 'Install go and go corset'

runs:
  using: 'composite'
  steps:
    - name: Install Go
      uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.24.6'
        cache-dependency-path: "**/*.sum"

    - name: Install Go Corset
      shell: bash
      run: go install github.com/consensys/go-corset/cmd/go-corset@9625b92a783d912c0182768f6e091b95b5da5eb9 #v1.1.30-rc2
